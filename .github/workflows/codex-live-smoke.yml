name: Authenticated Codex live smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  real-codex-smoke:
    name: Codex live smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    env:
      OPENAI_API_KEY: ${{ secrets.CODEX_SMOKE_API_KEY }}
      CODEX_HOME: ${{ runner.temp }}/codex-smoke-home
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.11"
      - name: Require live-test credentials
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::Configure secret CODEX_SMOKE_API_KEY for main/nightly authenticated Codex smoke."
            exit 1
          fi
          mkdir -p "$CODEX_HOME"
          printf '# pinned Codex smoke configuration\n' > "$CODEX_HOME/config.toml"
          chmod 700 "$CODEX_HOME"
          chmod 600 "$CODEX_HOME/config.toml"
      - name: Install tested Codex CLI
        run: npm install --global @openai/codex@0.162.1
      - name: Verify Codex CLI version
        run: codex --version
      - name: Execute trivial Codex skill and capture redacted protocol transcript
        shell: bash
        run: python tests/live_codex_smoke.py --capture "$RUNNER_TEMP/codex-smoke-transcript.json"
      - name: Upload sanitized transcript for manual golden review
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: codex-smoke-sanitized-${{ matrix.os }}
          path: ${{ runner.temp }}/codex-smoke-transcript.json
          if-no-files-found: warn
          retention-days: 7
